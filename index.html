<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jom-Mula | Let's Go Swipe Je!</title>
    
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: 'Lexend', sans-serif;
            background-color: #f9fafb;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .soft-card {
            border-radius: 30px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Animasi Masuk Kad */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: slideUp 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen pb-24">

    <nav class="p-6 flex justify-between items-center bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-200">J</div>
            <span class="text-xl font-semibold text-gray-800 tracking-tight">jom-mula</span>
        </div>
        <div class="flex gap-4">
            <button id="profile-trigger" class="p-2 bg-gray-50 rounded-full hover:bg-indigo-50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                </svg>
            </button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 mt-8">
        
        <section class="mb-10">
            <div class="relative group">
                <input type="text" id="search-input" 
                       placeholder="Nak belajar apa hari ini? (cth: Masa, Disiplin)" 
                       class="w-full p-6 pl-14 rounded-[28px] border-2 border-transparent bg-white shadow-xl shadow-indigo-100/50 focus:border-indigo-300 focus:ring-0 outline-none transition-all text-gray-700 text-lg">
                <div class="absolute left-6 top-6 text-gray-400 group-focus-within:text-indigo-500 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <button id="search-btn" class="absolute right-3 top-3 bg-indigo-600 text-white px-8 py-3 rounded-full font-bold hover:bg-indigo-700 transition-all active:scale-95 shadow-lg shadow-indigo-200">
                    Cari
                </button>
            </div>
            <div id="search-suggestions" class="mt-4 flex flex-wrap gap-2 px-2">
                </div>
        </section>

        <section id="content-area">
            <div class="soft-card p-12 text-center bg-white shadow-sm border border-gray-50">
                <div class="text-7xl mb-6">✨</div>
                <h2 class="text-2xl font-bold text-gray-800 mb-3">Sedia Untuk Bermula?</h2>
                <p class="text-gray-500 leading-relaxed">Cari topik kemahiran hidup yang anda mahu kuasai. Kami bimbing anda langkah-demi-langkah.</p>
            </div>
        </section>

        <div id="nav-controls" class="hidden mt-10 flex justify-center gap-4 sticky bottom-8">
            <button id="prev-step" class="bg-white text-gray-400 p-5 rounded-full shadow-xl hover:text-indigo-500 transition-all border border-gray-50 active:scale-90">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <button id="next-step" class="flex-1 bg-indigo-600 text-white px-8 py-5 rounded-[25px] font-bold shadow-xl shadow-indigo-200 hover:bg-indigo-700 transition-all active:scale-[0.98]">
                Langkah Seterusnya
            </button>
        </div>

    </main>

    <div id="config-modal" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-[100] hidden items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[40px] p-8 shadow-2xl transition-all">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-2xl font-bold text-gray-800 tracking-tight">Tetapan Bimbingan</h3>
                <button id="close-modal" class="w-10 h-10 flex items-center justify-center bg-gray-50 rounded-full text-gray-400 hover:text-red-500 transition-colors">✕</button>
            </div>
            
            <div id="profile-options-container" class="space-y-6">
                </div>

            <button id="save-profile" class="w-full bg-indigo-600 text-white py-5 rounded-[22px] mt-8 font-bold shadow-lg shadow-indigo-100 active:scale-95 transition-all">
                Simpan & Kemaskini
            </button>
        </div>
    </div>

    <script src="database_soalan.js"></script>
    <script src="database_jawapan.js"></script>
    <script src="confetti.js"></script>
    <script src="badges.js"></script>
    <script src="share.js"></script>
    <script src="donation.js"></script>
    <script src="index.js"></script>

</body>
</html>
