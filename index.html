<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jom-Mula | Let's Go Swipe Je!</title>
    
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: 'Lexend', sans-serif;
            background-color: #f9fafb;
            touch-action: manipulation; /* Optimum untuk mobile swipe */
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="p-6 flex justify-between items-center bg-white shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-bold text-xl shadow-lg">J</div>
            <span class="text-xl font-semibold text-gray-800 tracking-tight">jom-mula</span>
        </div>
        <div class="flex gap-4">
            <button id="profile-trigger" class="p-2 bg-gray-50 rounded-full hover:bg-indigo-50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                </svg>
            </button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 mt-6">
        
        <section class="mb-8">
            <div class="relative group">
                <input type="text" id="search-input" 
                       placeholder="Nak belajar apa hari ini? (cth: Nasi, Solat)" 
                       class="w-full p-5 pl-12 rounded-[25px] border-2 border-transparent bg-white shadow-xl focus:border-indigo-300 focus:ring-0 outline-none transition-all text-gray-700">
                <div class="absolute left-5 top-5 text-gray-400 group-focus-within:text-indigo-500 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <button id="search-btn" class="absolute right-3 top-3 bg-indigo-600 text-white px-6 py-2 rounded-full font-medium hover:bg-indigo-700 transition-all active:scale-95 shadow-md">
                    Cari
                </button>
            </div>
            <div id="search-suggestions" class="mt-3 flex flex-wrap gap-2 px-2">
                </div>
        </section>

        <section id="content-area">
            <div class="soft-card p-12 text-center bg-white rounded-[30px] shadow-sm">
                <div class="text-6xl mb-4">👋</div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Selamat Datang!</h2>
                <p class="text-gray-500 leading-relaxed">Taip apa sahaja yang anda ingin pelajari di atas untuk bermula langkah-demi-langkah.</p>
            </div>
        </section>

        <div id="nav-controls" class="hidden mt-8 flex justify-center gap-4">
            <button id="prev-step" class="bg-white text-gray-400 p-4 rounded-full shadow-md hover:text-indigo-500 transition-all border border-gray-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <button id="next-step" class="flex-1 bg-indigo-600 text-white px-8 py-4 rounded-full font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all active:scale-95">
                Langkah Seterusnya
            </button>
        </div>

    </main>

    <div id="config-modal" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-[100] hidden items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[35px] p-8 shadow-2xl animate-slideUp">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-800">Tetapan Profil</h3>
                <button id="close-modal" class="text-gray-400">✕</button>
            </div>
            <div id="profile-options-container"></div>
            <button id="save-profile" class="w-full bg-gray-800 text-white py-4 rounded-2xl mt-6 font-bold">Simpan Tetapan</button>
        </div>
    </div>

    <script src="database_soalan.js"></script>
    <script src="database_jawapan.js"></script>
    <script src="confetti.js"></script>
    <script src="badges.js"></script>
    <script src="share.js"></script>
    <script src="donation.js"></script>
    <script src="index.js"></script>

</body>
</html>
